# .github/workflows/pages.yml
name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node first
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'   # optional but nice to have

      # ✅ Install pnpm CLI reliably (no Corepack)
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false  # we'll run install explicitly next

      # Sanity check (you should see a version printed in logs)
      - run: pnpm --version

      # Install deps & build
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # GitHub Pages steps
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
